<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="topbar">
    <div class="row">
      <span class="badge">LOGIN</span>
      <span class="muted">GroceryBot</span>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="window.location.href='idle.html'">Home</button>
    </div>
  </div>

  <div class="container">
    <h1>Sign in</h1>
    <p class="muted">Customers and employees can sign in here. Only customers can be created here.</p>

    <div class="panel">
      <div class="grid2">
        <label class="field">
          <span class="muted">Username</span>
          <input id="username" placeholder="customer_001" />
        </label>
        <label class="field">
          <span class="muted">Password</span>
          <input id="password" type="password" placeholder="••••••" />
        </label>
      </div>

      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="btnLogin">Login</button>
        <button class="btn" onclick="window.location.href='create_customer.html'">Create Customer Account</button>
      </div>

      <div id="msg" class="muted" style="margin-top:12px"></div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    idleTimeout(60000);

    document.getElementById("btnLogin").addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");
      msg.textContent = "";

      try {
        const user = await apiPost("/api/auth/login", { username, password });
        setSession(user);

        if (user.access_level === "customer") window.location.href = "customer.html";
        else if (user.access_level === "employee") window.location.href = "employee.html";
        else throw new Error("Unknown access level");
      } catch (e) {
        msg.textContent = "Login failed: " + e.message;
      }
    });
  </script>
</body>
</html>
