<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="images/GroceryBot_FirstLogo.png" />
  <title>GOFR Login</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="topbar">
    <div class="row">
      <img class="topbar-logo" src="images/full_logo.png" alt="GOFR logo" />
      <span class="badge">LOGIN</span>
      <div class="lang-switch" aria-label="Language">
        <a class="lang-btn active" href="login.html" title="English"><img class="flag-icon" src="images/USA.png" alt="English" /></a>
        <a class="lang-btn" href="login_es.html" title="Español"><img class="flag-icon" src="images/Spanish.png" alt="Español" /></a>
        <a class="lang-btn" href="login_zh.html" title="中文"><img class="flag-icon" src="images/Mandarin.png" alt="中文" /></a>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="window.location.href='idle.html'">Home</button>
    </div>
  </div>

  <div class="container">
    <h1>Customer Login</h1>
    <p class="muted">Enter your Member ID, or continue as guest.</p>

    <div class="panel">
      <div class="grid2" style="grid-template-columns:1fr">
        <label class="field">
          <span class="muted">Member ID</span>
          <input id="memberID" placeholder="Ex: M1001" />
        </label>
      </div>

      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="btnLogin">Continue as Member</button>
        <button class="btn" onclick="window.location.href='create_customer.html'">Create Customer Account</button>
        <button class="btn" id="guest">Continue as Guest</button>
      </div>

      <div id="msg" class="muted" style="margin-top:12px"></div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    idleTimeout(60000);

    function randomGuestId() {
      const a = Math.random().toString(36).slice(2, 6).toUpperCase();
      const b = Date.now().toString(36).slice(-5).toUpperCase();
      return `G-${a}${b}`;
    }

    document.getElementById("btnLogin").addEventListener("click", async () => {
      const member_ID = document.getElementById("memberID").value.trim();
      const msg = document.getElementById("msg");
      msg.textContent = "";
      if (!member_ID) {
        msg.textContent = "Please enter a Member ID.";
        return;
      }

      try {
        const user = await apiPost("/api/auth/login", { member_ID });
        setSession(user);
        window.location.href = "customer.html";
      } catch (e) {
        msg.textContent = "Login failed: " + e.message;
      }
    });

    document.getElementById("guest").onclick = () => {
      setSession({
        member_ID: randomGuestId(),
        first_name: "Guest",
        last_name: "",
        access_level: "customer",
        guest: true
      });
      window.location.href = "customer.html";
    };
  </script>
</body>
</html>
