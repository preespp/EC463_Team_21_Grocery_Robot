<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Customer</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="topbar">
    <div class="row">
      <span class="badge">CUSTOMER</span>
      <span class="muted" id="who"></span>
    </div>
    <div class="row">
      <button class="btn danger" id="logout">Logout</button>
    </div>
  </div>

  <div class="container">
    <h1>Shop</h1>
    <p class="muted">Select quantity from inventory.</p>

    <div class="grid2 customer-grid" id="shopGrid">
      <div class="panel">
        <div class="row" style="justify-content:space-between">
          <b>Inventory</b>
        </div>
        <div style="height:10px"></div>
        <div id="inv" class="scroll-box"></div>
      </div>

      <button class="cart-toggle-arrow middle-toggle" id="toggleCart" aria-label="Hide cart" title="Hide cart">▶</button>

      <div class="panel" id="cartPanel">
        <div class="row" style="justify-content:space-between">
          <b>Cart</b>
          <button class="btn" id="clear">Clear</button>
        </div>
        <div id="cart" class="scroll-box"></div>
        <hr/>
        <div class="row" style="justify-content:space-between">
          <div class="muted" id="msg"></div>
          <button class="btn primary" id="submit">Submit Order</button>
        </div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    const user = requireLogin();
    if (user.access_level !== "customer") window.location.href = "login.html";
    const memberID = user.member_ID || user.id || user.username;
    if (!memberID) window.location.href = "login.html";

    const first = (user.first_name || "").trim();
    const last = (user.last_name || "").trim();
    const fullName = `${first} ${last}`.trim();
    const who = user.guest
      ? `Guest (${memberID})`
      : fullName
        ? `${fullName} (${memberID})`
        : `${memberID}`;
    document.getElementById("who").textContent = who;

    idleTimeoutWithWarnings({
        totalMs: 5 * 60 * 1000,      // 5 minutes
        warnMs: 4 * 60 * 1000,       // 4 minutes
        warnText: "No activity detected Logging out in 1 minute...",
        finalText: "Timeout reached. Logging out in 5 seconds...",
        finalPopupMs: 5000,
        onTimeout: () => {
            clearSession();
            window.location.href = "idle.html";
        }
    });

    const invEl = document.getElementById("inv");
    const cartEl = document.getElementById("cart");
    const msgEl = document.getElementById("msg");
    const shopGrid = document.getElementById("shopGrid");
    const toggleCartBtn = document.getElementById("toggleCart");

    let msgTimer = null;

    function showMsg(text, ms = 3000) {
    msgEl.textContent = text;
    if (msgTimer) clearTimeout(msgTimer);
    msgTimer = setTimeout(() => {
        // only clear if it hasn't been replaced by a newer message
        if (msgEl.textContent === text) msgEl.textContent = "";
    }, ms);
    }

    let inventory = [];
    let cart = new Map();
    let cartVisible = true;

    function setCartVisible(visible) {
      cartVisible = visible;
      shopGrid.classList.toggle("cart-hidden", !visible);
      invEl.classList.toggle("inv-expanded", !visible);
      toggleCartBtn.textContent = visible ? "▶" : "◀";
      toggleCartBtn.title = visible ? "Hide cart" : "Show cart";
      toggleCartBtn.setAttribute("aria-label", visible ? "Hide cart" : "Show cart");
    }

    document.getElementById("logout").onclick = () => { clearSession(); window.location.href="login.html"; };
    toggleCartBtn.onclick = () => setCartVisible(!cartVisible);
    setCartVisible(true);

function renderInventory() {
  invEl.innerHTML = "";
  const table = document.createElement("table");
  table.innerHTML = `
    <thead><tr>
      <th>Name</th><th>Price</th><th>Stock</th><th>Qty</th>
    </tr></thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector("tbody");

  for (const it of inventory) {
    const dbStock = Math.max(0, Number(it.stock || 0));
    let qtyInCart = cart.get(it.id)?.qty || 0;

    if (qtyInCart > dbStock) {
      if (dbStock === 0) cart.delete(it.id);
      else cart.set(it.id, { inv: it, qty: dbStock });
      qtyInCart = dbStock;
    }

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${it.name ?? ""}</td>
      <td>${it.price ?? ""}</td>
      <td>${dbStock}</td>
      <td></td>
    `;

    const qtyCell = tr.children[3];
    const qtySelect = document.createElement("select");
    qtySelect.style.width = "120px";

    for (let q = 0; q <= dbStock; q += 1) {
      const opt = document.createElement("option");
      opt.value = String(q);
      opt.textContent = String(q);
      qtySelect.appendChild(opt);
    }

    qtySelect.value = String(qtyInCart);
    qtySelect.onchange = () => {
      const qty = Number(qtySelect.value || 0);
      if (qty <= 0) {
        cart.delete(it.id);
      } else {
        cart.set(it.id, { inv: it, qty });
      }
      renderCart();
      renderInventory();
    };
    qtyCell.appendChild(qtySelect);

    tbody.appendChild(tr);
  }

  invEl.appendChild(table);
}


    function renderCart() {
      cartEl.innerHTML = "";
      if (cart.size === 0) {
        cartEl.innerHTML = `<div class="muted">Cart is empty</div>`;
        return;
      }

      const table = document.createElement("table");
      table.innerHTML = `
        <thead><tr>
          <th>Name</th><th>Qty</th><th></th>
        </tr></thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector("tbody");

          //           <td>
          //   <input class="qty-input" type="number" min="1"
          //     value="${entry.qty}" />
          // </td>

      for (const [id, entry] of cart.entries()) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${entry.inv.name}</td>
          <td class="row">
            <button class="btn" data-a="-">-</button>
            <span style="min-width:40px;display:inline-block;text-align:center">${entry.qty}</span>
            <button class="btn" data-a="+">+</button>
          </td>
          <td><button class="btn danger">Remove</button></td>
        `;
        const [minus, plus] = tr.querySelectorAll("button[data-a]");
        minus.onclick = () => {
          entry.qty = Math.max(1, entry.qty - 1);
          cart.set(id, entry);
          renderCart();
          renderInventory();
        };

        plus.onclick = () => {
        const dbStock = Number(entry.inv.stock || 0);
        if (entry.qty >= dbStock) {
            showMsg("Cannot add more: not enough stock.", 3000);
            return;
        }
        entry.qty += 1;
        cart.set(id, entry);
        renderCart();
        renderInventory();
        };

        tr.querySelector(".btn.danger").onclick = () => {
        cart.delete(id);
        renderCart();
        renderInventory();
        };
        tbody.appendChild(tr);
      }

      cartEl.appendChild(table);
    }

    async function loadInventory() {
      msgEl.textContent = "";
      const data = await apiGet("/api/inventory/list");
      inventory = data.items;
      renderInventory();
    }

    // const qtyInput = tr.querySelector(".qty-input");
    // qtyInput.addEventListener("change", () => {
    //   const dbStock = Number(entry.inv.stock || 0);
    //   const v = Math.max(1, Number(qtyInput.value || 1));
    //   entry.qty = Math.min(v, dbStock);     // clamp to stock
    //   cart.set(id, entry);
    //   renderCart();
    //   renderInventory();
    // });

    // document.getElementById("refresh").onclick = loadInventory;
    document.getElementById("clear").onclick = () => { cart.clear(); renderCart(); renderInventory();};

    document.getElementById("submit").onclick = async () => {
      msgEl.textContent = "";
      if (cart.size === 0) { msgEl.textContent = "Cart is empty"; return; }

      // Build payload to match server.js required fields
      const items = [];
      for (const entry of cart.values()) {
        const it = entry.inv;
        items.push({
        	product_id: it.id,
          name: it.name,
          price: it.price,
          x: it.x,
          y: it.y,
          z: it.z,
          stock: it.stock,
          qty: entry.qty
        });
      }

      try {
        const resp = await apiPost("/api/order/customer", {
          member_ID: memberID,
          guest: Boolean(user.guest),
          items
        });
        sessionStorage.setItem("last_order_id", String(resp.order_id || ""));
        sessionStorage.setItem("last_order_items", JSON.stringify(items));
        window.location.href = "wait.html";
      } catch (e) {
        msgEl.textContent = "Submit failed: " + e.message;
      }
    };

    loadInventory();
    renderCart();
  </script>
</body>
</html>
