<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="images/GroceryBot_FirstLogo.png" />
  <title>创建顾客</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="topbar">
    <div class="row">
      <span class="badge">创建顾客</span>
      <span class="muted">GroceryBot</span>
      <div class="lang-switch" aria-label="语言">
        <a class="lang-btn" href="create_customer.html" title="English"><img class="flag-icon" src="images/USA.png" alt="English" /></a>
        <a class="lang-btn" href="create_customer_es.html" title="Español"><img class="flag-icon" src="images/Spanish.png" alt="Español" /></a>
        <a class="lang-btn active" href="create_customer_zh.html" title="中文"><img class="flag-icon" src="images/Mandarin.png" alt="中文" /></a>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="window.location.href='login_zh.html'">返回</button>
    </div>
  </div>

  <div class="container">
    <h1>创建顾客账号</h1>
    <p class="muted">会员 ID 将自动生成（3 个字母 + 3 个数字）。</p>

    <div class="panel">
      <div class="grid2">
        <label class="field">
          <span class="muted">名</span>
          <input id="first" placeholder="" />
        </label>
        <label class="field">
          <span class="muted">姓</span>
          <input id="last" placeholder="" />
        </label>
      </div>

      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="btnCreate">创建</button>
      </div>

      <div id="msg" class="muted" style="margin-top:12px"></div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    idleTimeout(60000);

    document.getElementById("btnCreate").addEventListener("click", async () => {
      const msg = document.getElementById("msg");
      msg.textContent = "";

      const first_name = document.getElementById("first").value.trim();
      const last_name = document.getElementById("last").value.trim();

      if (!first_name || !last_name) {
        msg.textContent = "请填写名和姓。";
        return;
      }

      try {
        const resp = await apiPost("/api/account/create_customer", { first_name, last_name });
        msg.textContent = `创建成功。您的会员 ID：${resp.member_ID}。正在跳转...`;
        setTimeout(() => {
          window.location.href = "idle.html";
        }, 800);
      } catch (e) {
        msg.textContent = "创建失败: " + e.message;
      }
    });
  </script>
</body>
</html>
