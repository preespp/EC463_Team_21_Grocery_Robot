<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="images/GroceryBot_FirstLogo.png" />
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="topbar">
    <div class="row">
      <span class="badge">INICIO</span>
      <span class="muted">GroceryBot</span>
      <div class="lang-switch" aria-label="Idioma">
        <a class="lang-btn" href="login.html" title="English"><img class="flag-icon" src="images/USA.png" alt="English" /></a>
        <a class="lang-btn active" href="login_es.html" title="Español"><img class="flag-icon" src="images/Spanish.png" alt="Español" /></a>
        <a class="lang-btn" href="login_zh.html" title="中文"><img class="flag-icon" src="images/Mandarin.png" alt="中文" /></a>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="window.location.href='idle.html'">Inicio</button>
    </div>
  </div>

  <div class="container">
    <h1>Acceso de Cliente</h1>
    <p class="muted">Ingrese su ID de miembro o continúe como invitado.</p>

    <div class="panel">
      <div class="grid2" style="grid-template-columns:1fr">
        <label class="field">
          <span class="muted">ID de miembro</span>
          <input id="memberID" placeholder="Ej: AAA001" />
        </label>
      </div>

      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="btnLogin">Continuar como miembro</button>
        <button class="btn" onclick="window.location.href='create_customer_es.html'">Crear cuenta de cliente</button>
        <button class="btn" id="guest">Continuar como invitado</button>
      </div>

      <div id="msg" class="muted" style="margin-top:12px"></div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    idleTimeout(60000);

    function randomGuestId() {
      const a = Math.random().toString(36).slice(2, 6).toUpperCase();
      const b = Date.now().toString(36).slice(-5).toUpperCase();
      return `G-${a}${b}`;
    }

    document.getElementById("btnLogin").addEventListener("click", async () => {
      const member_ID = document.getElementById("memberID").value.trim();
      const msg = document.getElementById("msg");
      msg.textContent = "";
      if (!member_ID) {
        msg.textContent = "Ingrese un ID de miembro.";
        return;
      }

      try {
        const user = await apiPost("/api/auth/login", { member_ID });
        setSession(user);
        window.location.href = "customer_es.html";
      } catch (e) {
        msg.textContent = "Error de inicio: " + e.message;
      }
    });

    document.getElementById("guest").onclick = () => {
      setSession({
        member_ID: randomGuestId(),
        first_name: "Invitado",
        last_name: "",
        access_level: "customer",
        guest: true
      });
      window.location.href = "customer_es.html";
    };
  </script>
</body>
</html>
