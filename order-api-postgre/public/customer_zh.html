<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="images/GroceryBot_FirstLogo.png" />
  <title>顾客</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="topbar">
    <div class="row">
      <span class="badge">顾客</span>
      <span class="muted" id="who"></span>
      <div class="lang-switch" aria-label="语言">
        <a class="lang-btn" href="customer.html" title="English"><img class="flag-icon" src="images/USA.png" alt="English" /></a>
        <a class="lang-btn" href="customer_es.html" title="Español"><img class="flag-icon" src="images/Spanish.png" alt="Español" /></a>
        <a class="lang-btn active" href="customer_zh.html" title="中文"><img class="flag-icon" src="images/Mandarin.png" alt="中文" /></a>
      </div>
    </div>
    <div class="row">
      <button class="btn danger" id="logout">退出</button>
    </div>
  </div>

  <div id="ai-chat">

    <div id="ai-header">
      🤖 AI 助手
      <span id="ai-close">✕</span>
    </div>

    <div id="ai-messages"></div>

    <div id="ai-input-area">
      <input id="ai-input" placeholder="想问点什么..." />
      <button id="ai-send">发送</button>
    </div>

  </div>

  <button id="ai-toggle">🤖</button>

  <div class="container">
    <h1>购物</h1>
    <p class="muted">请选择库存数量。</p>

    <div class="grid2 customer-grid" id="shopGrid">
      <div class="panel">
        <div class="row" style="justify-content:space-between">
          <b>库存</b>
          <label class="row muted" for="categoryFilter" style="gap:8px">
            分类
            <select id="categoryFilter" style="min-width:160px"></select>
          </label>
        </div>
        <div style="height:10px"></div>
        <div id="inv" class="scroll-box"></div>
      </div>

      <button class="cart-toggle-arrow middle-toggle" id="toggleCart" aria-label="隐藏购物车" title="隐藏购物车">▶</button>

      <div class="panel" id="cartPanel">
        <div class="row" style="justify-content:space-between">
          <b>购物车</b>
          <button class="btn" id="clear">清空</button>
        </div>
        <div id="cart" class="scroll-box"></div>
        <hr/>
        <div class="row" style="justify-content:space-between">
          <div class="muted" id="msg"></div>
          <button class="btn primary" id="submit">提交订单</button>
        </div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    const user = getSession();
    if (!user) {
      window.location.href = "login_zh.html";
      throw new Error("No active session");
    }
    if (user.access_level !== "customer") window.location.href = "login_zh.html";
    const memberID = user.member_ID || user.id || user.username;
    if (!memberID) window.location.href = "login_zh.html";

    const first = (user.first_name || "").trim();
    const last = (user.last_name || "").trim();
    const fullName = `${first} ${last}`.trim();
    const who = user.guest
      ? `访客 (${memberID})`
      : fullName
        ? `${fullName} (${memberID})`
        : `${memberID}`;
    document.getElementById("who").textContent = who;

    idleTimeoutWithWarnings({
        totalMs: 5 * 60 * 1000,      // 5 minutes
        warnMs: 4 * 60 * 1000,       // 4 minutes
        warnText: "检测到无操作，1 分钟后将退出登录...",
        finalText: "会话超时，5 秒后退出登录...",
        finalPopupMs: 5000,
        onTimeout: () => {
            clearSession();
            window.location.href = "idle.html";
        }
    });

    const invEl = document.getElementById("inv");
    const cartEl = document.getElementById("cart");
    const msgEl = document.getElementById("msg");
    const shopGrid = document.getElementById("shopGrid");
    const toggleCartBtn = document.getElementById("toggleCart");
    const categoryFilterEl = document.getElementById("categoryFilter");

    let msgTimer = null;

    function showMsg(text, ms = 3000) {
    msgEl.textContent = text;
    if (msgTimer) clearTimeout(msgTimer);
    msgTimer = setTimeout(() => {
        // only clear if it hasn't been replaced by a newer message
        if (msgEl.textContent === text) msgEl.textContent = "";
    }, ms);
    }

    let inventory = [];
    let cart = new Map();
    let cartVisible = true;
    let selectedCategoryKey = "ALL";

    function setCartVisible(visible) {
      cartVisible = visible;
      shopGrid.classList.toggle("cart-hidden", !visible);
      invEl.classList.toggle("inv-expanded", !visible);
      toggleCartBtn.textContent = visible ? "▶" : "◀";
      toggleCartBtn.title = visible ? "隐藏购物车" : "显示购物车";
      toggleCartBtn.setAttribute("aria-label", visible ? "隐藏购物车" : "显示购物车");
    }

    document.getElementById("logout").onclick = () => { clearSession(); window.location.href="login_zh.html"; };
    toggleCartBtn.onclick = () => setCartVisible(!cartVisible);
    categoryFilterEl.onchange = () => {
      selectedCategoryKey = categoryFilterEl.value || "ALL";
      renderInventory();
    };
    setCartVisible(true);

    const chat = document.getElementById("ai-chat")
    const toggle = document.getElementById("ai-toggle")
    const closeBtn = document.getElementById("ai-close")
    const messages = document.getElementById("ai-messages")

    toggle.onclick = ()=>{
      chat.style.display = "flex"
    }

    closeBtn.onclick = ()=>{
      chat.style.display = "none"
    }

    function addMessage(role,text){

      const row = document.createElement("div")
      row.className = "ai-row " + role

      const bubble = document.createElement("div")
      bubble.className = "ai-bubble"
      bubble.textContent = text

      row.appendChild(bubble)
      messages.appendChild(row)

      messages.scrollTop = messages.scrollHeight
    }

    document.getElementById("ai-send").onclick = async ()=>{

      const input = document.getElementById("ai-input")
      const q = input.value.trim()
      if(!q) return

      addMessage("user",q)
      input.value=""

      const r = await fetch("/api/customer/ai/ask",{
        method:"POST",
        headers:{ "Content-Type":"application/json"},
        body:JSON.stringify({ question:q })
      })

      const data = await r.json()

      addMessage("bot",data.answer)

    }

function categoryKeyForItem(it) {
  if (it.category_id !== null && it.category_id !== undefined && it.category_id !== "") {
    return `id:${String(it.category_id)}`;
  }
  const name = String(it.category_name || "").trim();
  return `name:${name || "未分类"}`;
}

function categoryLabelForItem(it) {
  const byName = String(it.category_name || "").trim();
  if (byName) return byName;
  if (it.category_id !== null && it.category_id !== undefined && it.category_id !== "") {
    return `分类 ${it.category_id}`;
  }
  return "未分类";
}

function updateCategoryFilterOptions() {
  const categories = new Map();
  for (const it of inventory) {
    categories.set(categoryKeyForItem(it), categoryLabelForItem(it));
  }

  const options = [...categories.entries()].sort((a, b) => a[1].localeCompare(b[1]));
  const availableKeys = new Set(options.map(([k]) => k));
  if (selectedCategoryKey !== "ALL" && !availableKeys.has(selectedCategoryKey)) {
    selectedCategoryKey = "ALL";
  }

  categoryFilterEl.innerHTML = "";

  const allOpt = document.createElement("option");
  allOpt.value = "ALL";
  allOpt.textContent = "全部分类";
  categoryFilterEl.appendChild(allOpt);

  for (const [key, label] of options) {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = label;
    categoryFilterEl.appendChild(opt);
  }

  categoryFilterEl.value = selectedCategoryKey;
}

function renderInventory() {
  invEl.innerHTML = "";
  const visibleInventory = selectedCategoryKey === "ALL"
    ? inventory
    : inventory.filter((it) => categoryKeyForItem(it) === selectedCategoryKey);

  if (visibleInventory.length === 0) {
    invEl.innerHTML = `<div class="muted">所选分类暂无库存。</div>`;
    return;
  }

  const table = document.createElement("table");
  table.innerHTML = `
    <thead><tr>
      <th>名称</th><th>分类</th><th>价格</th><th>库存</th><th>数量</th>
    </tr></thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector("tbody");

  for (const it of visibleInventory) {
    const dbStock = Math.max(0, Number(it.stock || 0));
    let qtyInCart = cart.get(it.id)?.qty || 0;

    if (qtyInCart > dbStock) {
      if (dbStock === 0) cart.delete(it.id);
      else cart.set(it.id, { inv: it, qty: dbStock });
      qtyInCart = dbStock;
    }

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${it.name ?? ""}</td>
      <td>${categoryLabelForItem(it)}</td>
      <td>${it.price ?? ""}</td>
      <td>${dbStock}</td>
      <td></td>
    `;

    const qtyCell = tr.children[4];
    const qtySelect = document.createElement("select");
    qtySelect.style.width = "120px";

    for (let q = 0; q <= dbStock; q += 1) {
      const opt = document.createElement("option");
      opt.value = String(q);
      opt.textContent = String(q);
      qtySelect.appendChild(opt);
    }

    qtySelect.value = String(qtyInCart);
    qtySelect.onchange = () => {
      const qty = Number(qtySelect.value || 0);
      if (qty <= 0) {
        cart.delete(it.id);
      } else {
        cart.set(it.id, { inv: it, qty });
      }
      renderCart();
      renderInventory();
    };
    qtyCell.appendChild(qtySelect);

    tbody.appendChild(tr);
  }

  invEl.appendChild(table);
}


    function renderCart() {
      cartEl.innerHTML = "";
      if (cart.size === 0) {
        cartEl.innerHTML = `<div class="muted">购物车为空</div>`;
        return;
      }

      const table = document.createElement("table");
      table.innerHTML = `
        <thead><tr>
          <th>名称</th><th>数量</th><th></th>
        </tr></thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector("tbody");

          //           <td>
          //   <input class="qty-input" type="number" min="1"
          //     value="${entry.qty}" />
          // </td>

      for (const [id, entry] of cart.entries()) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${entry.inv.name}</td>
          <td class="row">
            <button class="btn" data-a="-">-</button>
            <span style="min-width:40px;display:inline-block;text-align:center">${entry.qty}</span>
            <button class="btn" data-a="+">+</button>
          </td>
          <td><button class="btn danger">移除</button></td>
        `;
        const [minus, plus] = tr.querySelectorAll("button[data-a]");
        minus.onclick = () => {
          entry.qty = Math.max(1, entry.qty - 1);
          cart.set(id, entry);
          renderCart();
          renderInventory();
        };

        plus.onclick = () => {
        const dbStock = Number(entry.inv.stock || 0);
        if (entry.qty >= dbStock) {
            showMsg("无法继续添加：库存不足。", 3000);
            return;
        }
        entry.qty += 1;
        cart.set(id, entry);
        renderCart();
        renderInventory();
        };

        tr.querySelector(".btn.danger").onclick = () => {
        cart.delete(id);
        renderCart();
        renderInventory();
        };
        tbody.appendChild(tr);
      }

      cartEl.appendChild(table);
    }

    async function loadInventory() {
      msgEl.textContent = "";
      const data = await apiGet("/api/inventory/list?lang=zh-cn");
      inventory = data.items;
      updateCategoryFilterOptions();
      renderInventory();
    }

    // const qtyInput = tr.querySelector(".qty-input");
    // qtyInput.addEventListener("change", () => {
    //   const dbStock = Number(entry.inv.stock || 0);
    //   const v = Math.max(1, Number(qtyInput.value || 1));
    //   entry.qty = Math.min(v, dbStock);     // clamp to stock
    //   cart.set(id, entry);
    //   renderCart();
    //   renderInventory();
    // });

    // document.getElementById("refresh").onclick = loadInventory;
    document.getElementById("clear").onclick = () => { cart.clear(); renderCart(); renderInventory();};

    document.getElementById("submit").onclick = async () => {
      msgEl.textContent = "";
      if (cart.size === 0) { msgEl.textContent = "购物车为空"; return; }

      // Build payload to match server.js required fields
      const items = [];
      for (const entry of cart.values()) {
        const it = entry.inv;
        items.push({
        	product_id: it.id,
          name: it.name,
          price: it.price,
          x: it.x,
          y: it.y,
          z: it.z,
          stock: it.stock,
          qty: entry.qty
        });
      }

      try {
        const resp = await apiPost("/api/order/customer", {
          member_ID: memberID,
          guest: Boolean(user.guest),
          items
        });
        sessionStorage.setItem("last_order_id", String(resp.order_id || ""));
        sessionStorage.setItem("last_order_items", JSON.stringify(items));
        window.location.href = "wait.html";
      } catch (e) {
        msgEl.textContent = "提交失败: " + e.message;
      }
    };

    loadInventory();
    renderCart();
  </script>
</body>
</html>
