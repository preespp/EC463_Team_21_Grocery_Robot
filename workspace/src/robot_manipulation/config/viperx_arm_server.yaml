viperx_arm_server:
  ros__parameters:
    action_name: "pick_viperx"
    arm_group_name: "interbotix_arm"
    gripper_group_name: "interbotix_gripper"

    planning_time_sec: 3.0
    max_velocity_scaling: 0.2
    max_acceleration_scaling: 0.2
    enforce_orientation_path_constraint: false
    enforce_orientation_path_constraint_on_pose_moves: false
    use_position_target_with_orientation_constraint: true
    allow_orientation_constraint_fallback: false
    orientation_constraint_x_tolerance_rad: 0.12
    orientation_constraint_y_tolerance_rad: 0.12
    orientation_constraint_z_tolerance_rad: 1.57
    orientation_constraint_weight: 1.0
    preview_only: false
    preview_step_delay_sec: 1.0
    verify_final_orientation_match: false
    orientation_check_settle_sec: 0.15

    # Fallback values used if named targets are not available in the SRDF.
    open_gripper_pos: 0.035
    closed_gripper_pos: 0.040
    scan_center_joint_names: ["waist", "shoulder", "elbow", "forearm_roll", "wrist_angle", "wrist_rotate"]
    scan_center_joint_positions: [0.0, -1.36135682, 1.41371669, 0.0, 0.20943951, 0.0]
    scan_left_joint_names: ["waist", "shoulder", "elbow", "forearm_roll", "wrist_angle", "wrist_rotate"]
    scan_left_joint_positions: [0.78539816, -1.36135682, 1.41371669, 0.0, 0.20943951, 0.0]
    scan_right_joint_names: ["waist", "shoulder", "elbow", "forearm_roll", "wrist_angle", "wrist_rotate"]
    scan_right_joint_positions: [-0.78539816, -1.36135682, 1.41371669, 0.0, 0.20943951, 0.0]
    startup_joint_names: ["waist", "shoulder", "elbow", "forearm_roll", "wrist_angle", "wrist_rotate"]
    startup_joint_positions: [0.0, -1.85004901, 1.57079633, 0.0, 0.40142573, 0.0]
    place_joint_names: ["waist", "shoulder", "elbow", "forearm_roll", "wrist_angle", "wrist_rotate"]
    place_joint_positions: [1.81514242, -0.40142573, 1.51843645, 0.08726646, -1.13446401, -0.03490659]
    post_place_joint_names: ["waist", "shoulder", "elbow", "forearm_roll", "wrist_angle", "wrist_rotate"]
    post_place_joint_positions: [1.81514242, -1.06465084, 1.16937060, 0.43633231, -0.15707963, -0.41887902]
    pre_return_joint_names: ["waist", "shoulder", "elbow", "forearm_roll", "wrist_angle", "wrist_rotate"]
    pre_return_joint_positions: [0.0, -1.37881011, 1.20427718, 0.0, 0.27925268, 0.0]
    return_joint_names: ["waist", "shoulder", "elbow", "forearm_roll", "wrist_angle", "wrist_rotate"]
    return_joint_positions: [0.0, -1.85004901, 1.53588974, 0.0, 0.80285146, 0.0]
    lift_joint_names: ["waist", "shoulder", "elbow", "forearm_roll", "wrist_angle", "wrist_rotate"]
    lift_joint_positions: [0.0, -0.17453293, 1.39626340, 0.0, -1.20427718, 0.0]
    post_lift_joint_names: ["waist", "shoulder", "elbow", "forearm_roll", "wrist_angle", "wrist_rotate"]
    post_lift_joint_positions: [0.0, -0.82030475, 1.06465084, 0.0, -0.24434610, 0.0]

    # Interbotix SRDF defaults for gripper group states.
    open_gripper_named_target: "Released"
    close_gripper_named_target: ""
