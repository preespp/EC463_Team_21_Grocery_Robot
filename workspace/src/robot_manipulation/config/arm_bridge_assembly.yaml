# ROS -> Gazebo bridge for assembly CAD arm

- ros_topic_name: "/arm/joint1_cmd"
  gz_topic_name: "/model/assembly_robotic_arm/joint/joint1_base_yaw/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: "ROS_TO_GZ"

- ros_topic_name: "/arm/joint2_cmd"
  gz_topic_name: "/model/assembly_robotic_arm/joint/joint2_shoulder/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: "ROS_TO_GZ"

- ros_topic_name: "/arm/joint3_cmd"
  gz_topic_name: "/model/assembly_robotic_arm/joint/joint3_elbow/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: "ROS_TO_GZ"
