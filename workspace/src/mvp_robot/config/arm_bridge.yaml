# mvp_robot/config/arm_bridge.yaml
# Bridge ROS Float64 commands -> Gazebo Double for each joint

- ros_topic_name: "/arm/joint1_cmd"
  gz_topic_name: "/arm/joint1_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: "ROS_TO_GZ"

