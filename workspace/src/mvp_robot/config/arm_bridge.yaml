# ROS -> Gazebo bridge for arm joint position commands

- ros_topic_name: "/arm/joint1_cmd"
  gz_topic_name: "/model/five_dof_arm/joint/joint1_base_yaw/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: "ROS_TO_GZ"

